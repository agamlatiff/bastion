# .golangci.yml
version: "2"

run:
  timeout: 3m

linters:
  disable-all: true
  enable:
    - errcheck     # Check for unhandled errors
    - govet        # Standard go vet checks
    - ineffassign  # Check for unused variable assignments
    - staticcheck  # Strict static analysis (industry standard)
    - unused       # Check for unused constants, variables, or functions

issues:
  exclude-use-default: false
  