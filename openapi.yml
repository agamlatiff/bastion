openapi: 3.0.3
info:
  title: Bastion Backend API
  version: 1.0.0
  description: High-performance Fintech & E-Wallet Backend Engine

paths:
  # ==========================================
  # 🔐 1. AUTH ENDPOINTS
  # ==========================================
  /api/v1/auth/register:
    post:
      summary: User Registration
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: "agam@test.com"
                password:
                  type: string
                  minLength: 8
                  example: "password123"
                full_name:
                  type: string
                  example: "Agam Latiff"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                status: "success"
                message: "user registered successfully"
                data:
                  token: "eyJhbGciOiJIUzI1NiIs..."
                  user:
                    id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    email: "agam@test.com"
                    full_name: "Agam Latiff"
                    tier: "tier_1"
                    is_verified: false
                    created_at: "2026-08-17T10:00:00Z"
        "400":
          description: Validation error
          content:
            application/json:
              example:
                status: "error"
                error: "password must be at least 8 characters"
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                status: "error"
                error: "email already registered"

  /api/v1/auth/login:
    post:
      summary: User Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "agam@test.com"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login successful (or 2FA challenge if enabled)
          content:
            application/json:
              examples:
                login_success:
                  summary: Normal login — returns token pair
                  value:
                    status: "success"
                    message: "Login successfully"
                    data:
                      access_token: "eyJhbGciOiJIUzI1NiIs..."
                      refresh_token: "eyJhbGciOiJIUzI1NiIs..."
                      user:
                        id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                        email: "agam@test.com"
                        full_name: "Agam Latiff"
                        tier: "tier_1"
                        is_two_factor_enabled: false
                        created_at: "2026-08-17T10:00:00Z"
                two_factor_required:
                  summary: 2FA challenge — client must verify TOTP code
                  value:
                    status: "success"
                    message: "Two-factor authentication required"
                    data:
                      two_factor_required: true
                      temp_token: "eyJhbGciOiJIUzI1NiIs..."
        "401":
          description: Invalid credentials
          content:
            application/json:
              example:
                status: "error"
                error: "invalid email or password"

  /api/v1/auth/profile:
    get:
      summary: Get Current User Profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  email: "agam@test.com"
                  full_name: "Agam Latiff"
                  tier: "tier_1"
                  is_verified: false
                  created_at: "2026-08-17T10:00:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/logout:
    post:
      summary: User Logout (Blacklist Token)
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              example:
                status: "success"
                message: "successfully logged out"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/refresh:
    post:
      summary: Refresh Access Token (Rotate refresh token)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: "eyJhbGciOiJIUzI1NiIs..."
      responses:
        "200":
          description: New token pair issued (old refresh token invalidated)
          content:
            application/json:
              example:
                status: "success"
                message: "Token refreshed successfully"
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
                  refresh_token: "eyJhbGciOiJIUzI1NiIs..."
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              example:
                status: "error"
                error: "invalid or expired refresh token"

  /api/v1/auth/pin:
    post:
      summary: Set Transaction PIN (first time setup)
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pin
              properties:
                pin:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "123456"
      responses:
        "200":
          description: PIN set successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Transaction PIN has been successfully set"
        "400":
          description: PIN already set or invalid format
          content:
            application/json:
              example:
                status: "error"
                error: "pin already set"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"
    put:
      summary: Change Transaction PIN
      tags:
        - Auth
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_pin
                - new_pin
              properties:
                old_pin:
                  type: string
                  example: "123456"
                new_pin:
                  type: string
                  example: "654321"
      responses:
        "200":
          description: PIN changed successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Transaction PIN has been successfully changed"
        "400":
          description: Invalid old PIN or invalid format
          content:
            application/json:
              example:
                status: "error"
                error: "invalid pin"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/2fa/setup:
    post:
      summary: Setup 2FA — Generate secret & QR code URI
      description: Returns a Base32 secret and an otpauth:// URI to be scanned by Google Authenticator or Authy. Call /enable after scanning to activate.
      tags:
        - Auth (2FA)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 2FA secret and QR URI generated
          content:
            application/json:
              example:
                status: "success"
                message: "Scan this QR code in Google Authenticator or enter the secret manually"
                data:
                  secret: "JBSWY3DPEHPK3PXP"
                  otp_auth_url: "otpauth://totp/Bastion:agam@test.com?secret=JBSWY3DPEHPK3PXP&issuer=Bastion"
        "400":
          description: 2FA already enabled
          content:
            application/json:
              example:
                status: "error"
                error: "two-factor authentication is already enabled"
        "401":
          description: Unauthorized

  /api/v1/auth/2fa/enable:
    post:
      summary: Enable 2FA — Confirm with TOTP code from authenticator app
      tags:
        - Auth (2FA)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "123456"
      responses:
        "200":
          description: 2FA activated successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Two-factor authentication has been successfully activated"
        "400":
          description: Invalid TOTP code or 2FA not set up yet
          content:
            application/json:
              example:
                status: "error"
                error: "invalid two-factor authentication code"
        "401":
          description: Unauthorized

  /api/v1/auth/2fa/disable:
    post:
      summary: Disable 2FA — Confirm with TOTP code
      tags:
        - Auth (2FA)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: 2FA deactivated successfully
          content:
            application/json:
              example:
                status: "success"
                message: "Two-factor authentication has been deactivated"
        "400":
          description: Invalid code or 2FA not enabled
          content:
            application/json:
              example:
                status: "error"
                error: "two-factor authentication is not enabled"
        "401":
          description: Unauthorized

  /api/v1/auth/2fa/verify:
    post:
      summary: Verify 2FA Login — Submit TOTP code after login challenge
      description: After receiving two_factor_required=true from /login, submit the temp_token and TOTP code here to receive a full token pair.
      tags:
        - Auth (2FA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - temp_token
                - code
              properties:
                temp_token:
                  type: string
                  description: Short-lived 5-minute token received from /login
                  example: "eyJhbGciOiJIUzI1NiIs..."
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  example: "123456"
      responses:
        "200":
          description: 2FA verified — full token pair issued
          content:
            application/json:
              example:
                status: "success"
                message: "2FA Login successful"
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
                  refresh_token: "eyJhbGciOiJIUzI1NiIs..."
                  user:
                    id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    email: "agam@test.com"
                    full_name: "Agam Latiff"
                    tier: "tier_1"
                    is_two_factor_enabled: true
        "401":
          description: Invalid or expired temp_token, or wrong TOTP code
          content:
            application/json:
              example:
                status: "error"
                error: "invalid two-factor authentication code"

  # ==========================================
  # 💳 2. WALLET ENDPOINTS
  # ==========================================
  /api/v1/wallet/balance:
    get:
      summary: Get Wallet Balance & Tier Limits
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current wallet balance returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  wallet_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  user_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  balance: 500000
                  currency: "IDR"
                  max_balance_limit: 2000000
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/wallet/topup:
    post:
      summary: Top-Up Wallet Balance
      tags:
        - Wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - idempotency_key
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  example: 100000
                idempotency_key:
                  type: string
                  format: uuid
                  example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                description:
                  type: string
                  example: "Top-up saldo bulanan"
      responses:
        "200":
          description: Top-up successful
          content:
            application/json:
              example:
                status: "success"
                message: "top-up successful"
                data:
                  id: "tx-uuid-12345"
                  amount: 100000
                  fee_amount: 0
                  type: "topup"
                  status: "success"
                  description: "Top-up saldo bulanan"
                  created_at: "2026-08-17T10:00:00Z"
        "400":
          description: Exceeds tier limit or invalid amount
          content:
            application/json:
              example:
                status: "error"
                error: "top-up amount exceeds maximum wallet balance limit"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/wallet/transactions:
    get:
      summary: Get Paginated Transaction History
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of records to return
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  - id: "tx-123"
                    amount: 100000
                    type: "topup"
                    status: "success"
                    created_at: "2026-08-17T10:00:00Z"
                limit: 10
                offset: 0
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"
  /api/v1/wallet/transfer:
    post:
      summary: P2P Wallet Balance Transfer (Sprint 1.4)
      tags:
        - Wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - receiver_email
                - amount
                - idempotency_key
              properties:
                receiver_email:
                  type: string
                  format: email
                  example: "jack@test.com"
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  example: 50000
                idempotency_key:
                  type: string
                  format: uuid
                  example: "transfer-uuid-789"
                description:
                  type: string
                  example: "Lunch money"
      responses:
        "200":
          description: Transfer successful
          content:
            application/json:
              example:
                status: "success"
                message: "transfer successful"
                data:
                  id: "tx-uuid-999"
                  idempotency_key: "transfer-uuid-789"
                  sender_wallet_id: "wallet-uuid-111"
                  receiver_wallet_id: "wallet-uuid-222"
                  amount: 50000
                  fee_amount: 0
                  type: "transfer"
                  status: "success"
                  description: "Lunch money"
                  created_at: "2026-08-17T10:00:00Z"
        "400":
          description: Invalid request body or PIN not set
          content:
            application/json:
              example:
                status: "error"
                error: "pin not set"
        "401":
          description: Unauthorized or wrong transaction PIN
          content:
            application/json:
              examples:
                unauthorized:
                  value:
                    status: "error"
                    error: "unauthorized"
                invalid_pin:
                  value:
                    status: "error"
                    error: "invalid pin"
        "403":
          description: KYC Tier 2 required to make transfers
          content:
            application/json:
              example:
                status: "error"
                error: "kyc verification required to perform this action"
        "404":
          description: Receiver user or wallet not found
          content:
            application/json:
              examples:
                receiver_not_found:
                  value:
                    status: "error"
                    error: "receiver user not found"
                wallet_not_found:
                  value:
                    status: "error"
                    error: "receiver wallet not found"
        "409":
          description: Self-transfer or concurrent request conflict
          content:
            application/json:
              examples:
                self_transfer:
                  value:
                    status: "error"
                    error: "cannot transfer to yourself"
                concurrent:
                  value:
                    status: "error"
                    error: "a transfer is already in progress"
        "422":
          description: Insufficient balance or exceeds tier/daily limit
          content:
            application/json:
              examples:
                insufficient_balance:
                  value:
                    status: "error"
                    error: "insufficient balance"
                exceeds_limit:
                  value:
                    status: "error"
                    error: "transfer amount exceeds maximum wallet balance limit"
                daily_limit:
                  value:
                    status: "error"
                    error: "daily transfer limit exceeded"

  # ==========================================
  # 🪪 3. KYC ENDPOINTS
  # ==========================================
  /api/v1/auth/kyc:
    post:
      summary: Submit KYC Identity Verification (Upgrade to Tier 2)
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_card_number
                - id_card_image_url
                - selfie_image_url
              properties:
                id_card_number:
                  type: string
                  example: "3171012345670001"
                id_card_image_url:
                  type: string
                  example: "https://storage.bastion.com/ktp/user-123.jpg"
                selfie_image_url:
                  type: string
                  example: "https://storage.bastion.com/selfie/user-123.jpg"
      responses:
        "201":
          description: KYC application submitted successfully
          content:
            application/json:
              example:
                status: "success"
                message: "KYC application submitted successfully"
                data:
                  id: "kyc-uuid-123"
                  user_id: "usr-uuid-456"
                  id_card_number: "3171012345670001"
                  id_card_image_url: "https://storage.bastion.com/ktp/user-123.jpg"
                  selfie_image_url: "https://storage.bastion.com/selfie/user-123.jpg"
                  status: "pending"
                  submitted_at: "2026-08-17T10:00:00Z"
        "400":
          description: Validation error or user already tier 2
          content:
            application/json:
              example:
                status: "error"
                error: "user is already verified as tier 2"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/kyc/status:
    get:
      summary: Get KYC Application Status
      tags:
        - KYC
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC status returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "kyc-uuid-123"
                  user_id: "usr-uuid-456"
                  id_card_number: "3171012345670001"
                  status: "approved"
                  submitted_at: "2026-08-17T10:00:00Z"
                  verified_at: "2026-08-17T10:05:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"
        "404":
          description: No KYC submission found
          content:
            application/json:
              example:
                status: "error"
                error: "kyc application not found"

  /api/v1/auth/kyc/review:
    post:
      summary: Review & Approve KYC (Upgrade User Tier 1 -> Tier 2)
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: "approved"
                rejection_reason:
                  type: string
                  example: ""
      responses:
        "200":
          description: KYC reviewed and user upgraded to Tier 2 (if approved)
          content:
            application/json:
              example:
                status: "success"
                message: "KYC review processed successfully"
                data:
                  id: "kyc-uuid-123"
                  status: "approved"
                  verified_at: "2026-08-17T10:05:00Z"
        "400":
          description: Invalid review status or no pending submission
          content:
            application/json:
              example:
                status: "error"
                error: "only pending KYC applications can be reviewed"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  # ==========================================
  # 📜 4. AUDIT LOG ENDPOINTS
  # ==========================================
  /api/v1/auth/audit-logs:
    get:
      summary: Get User Activity & Security Audit Logs
      tags:
        - Audit
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of audit log records to return (default 20, max 100)
          required: false
          schema:
            type: integer
            default: 20
            example: 20
        - name: offset
          in: query
          description: Number of records to skip for pagination (default 0)
          required: false
          schema:
            type: integer
            default: 0
            example: 0
      responses:
        "200":
          description: List of user activity audit logs
          content:
            application/json:
              example:
                status: "success"
                data:
                  logs:
                    - id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                      user_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                      action: "LOGIN"
                      ip_address: "127.0.0.1"
                      user_agent: "PostmanRuntime/7.39.0"
                      metadata:
                        email: "agam@test.com"
                      created_at: "2026-08-20T22:30:00Z"
                    - id: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
                      user_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                      action: "TRANSFER"
                      ip_address: "127.0.0.1"
                      user_agent: "PostmanRuntime/7.39.0"
                      metadata:
                        amount: 50000
                        receiver_email: "receiver@test.com"
                        idempotency_key: "transfer-uuid-123"
                      created_at: "2026-08-20T22:32:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
