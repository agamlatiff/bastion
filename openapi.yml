openapi: 3.0.3
info:
  title: Bastion Backend API
  version: 1.0.0
  description: High-performance Fintech & E-Wallet Backend Engine

paths:
  # ==========================================
  # 🔐 1. AUTH ENDPOINTS
  # ==========================================
  /api/v1/auth/register:
    post:
      summary: User Registration
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - full_name
              properties:
                email:
                  type: string
                  format: email
                  example: "agam@test.com"
                password:
                  type: string
                  minLength: 8
                  example: "password123"
                full_name:
                  type: string
                  example: "Agam Latiff"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              example:
                status: "success"
                message: "user registered successfully"
                data:
                  token: "eyJhbGciOiJIUzI1NiIs..."
                  user:
                    id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    email: "agam@test.com"
                    full_name: "Agam Latiff"
                    tier: "tier_1"
                    is_verified: false
                    created_at: "2026-08-17T10:00:00Z"
        "400":
          description: Validation error
          content:
            application/json:
              example:
                status: "error"
                error: "password must be at least 8 characters"
        "409":
          description: Email already exists
          content:
            application/json:
              example:
                status: "error"
                error: "email already registered"

  /api/v1/auth/login:
    post:
      summary: User Login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "agam@test.com"
                password:
                  type: string
                  example: "password123"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              example:
                status: "success"
                message: "login successful"
                data:
                  token: "eyJhbGciOiJIUzI1NiIs..."
                  user:
                    id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                    email: "agam@test.com"
                    full_name: "Agam Latiff"
                    tier: "tier_1"
                    is_verified: false
        "401":
          description: Invalid credentials
          content:
            application/json:
              example:
                status: "error"
                error: "invalid email or password"

  /api/v1/auth/profile:
    get:
      summary: Get Current User Profile
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile retrieved
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  email: "agam@test.com"
                  full_name: "Agam Latiff"
                  tier: "tier_1"
                  is_verified: false
                  created_at: "2026-08-17T10:00:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/logout:
    post:
      summary: User Logout (Blacklist Token)
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              example:
                status: "success"
                message: "successfully logged out"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  # ==========================================
  # 💳 2. WALLET ENDPOINTS
  # ==========================================
  /api/v1/wallet/balance:
    get:
      summary: Get Wallet Balance & Tier Limits
      tags:
        - Wallet
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current wallet balance returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  wallet_id: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
                  user_id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  balance: 500000
                  currency: "IDR"
                  max_balance_limit: 2000000
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/wallet/topup:
    post:
      summary: Top-Up Wallet Balance
      tags:
        - Wallet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - idempotency_key
              properties:
                amount:
                  type: integer
                  format: int64
                  minimum: 1
                  example: 100000
                idempotency_key:
                  type: string
                  format: uuid
                  example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                description:
                  type: string
                  example: "Top-up saldo bulanan"
      responses:
        "200":
          description: Top-up successful
          content:
            application/json:
              example:
                status: "success"
                message: "top-up successful"
                data:
                  id: "tx-uuid-12345"
                  amount: 100000
                  fee_amount: 0
                  type: "topup"
                  status: "success"
                  description: "Top-up saldo bulanan"
                  created_at: "2026-08-17T10:00:00Z"
        "400":
          description: Exceeds tier limit or invalid amount
          content:
            application/json:
              example:
                status: "error"
                error: "top-up amount exceeds maximum wallet balance limit"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/wallet/transactions:
    get:
      summary: Get Paginated Transaction History
      tags:
        - Wallet
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Number of records to return
          schema:
            type: integer
            default: 10
        - name: offset
          in: query
          description: Number of records to skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of transactions returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  - id: "tx-123"
                    amount: 100000
                    type: "topup"
                    status: "success"
                    created_at: "2026-08-17T10:00:00Z"
                limit: 10
                offset: 0
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  # ==========================================
  # 🪪 3. KYC ENDPOINTS
  # ==========================================
  /api/v1/auth/kyc:
    post:
      summary: Submit KYC Identity Verification (Upgrade to Tier 2)
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id_card_number
                - id_card_image_url
                - selfie_image_url
              properties:
                id_card_number:
                  type: string
                  example: "3171012345670001"
                id_card_image_url:
                  type: string
                  example: "https://storage.bastion.com/ktp/user-123.jpg"
                selfie_image_url:
                  type: string
                  example: "https://storage.bastion.com/selfie/user-123.jpg"
      responses:
        "201":
          description: KYC application submitted successfully
          content:
            application/json:
              example:
                status: "success"
                message: "KYC application submitted successfully"
                data:
                  id: "kyc-uuid-123"
                  user_id: "usr-uuid-456"
                  id_card_number: "3171012345670001"
                  id_card_image_url: "https://storage.bastion.com/ktp/user-123.jpg"
                  selfie_image_url: "https://storage.bastion.com/selfie/user-123.jpg"
                  status: "pending"
                  submitted_at: "2026-08-17T10:00:00Z"
        "400":
          description: Validation error or user already tier 2
          content:
            application/json:
              example:
                status: "error"
                error: "user is already verified as tier 2"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

  /api/v1/auth/kyc/status:
    get:
      summary: Get KYC Application Status
      tags:
        - KYC
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC status returned
          content:
            application/json:
              example:
                status: "success"
                data:
                  id: "kyc-uuid-123"
                  user_id: "usr-uuid-456"
                  id_card_number: "3171012345670001"
                  status: "approved"
                  submitted_at: "2026-08-17T10:00:00Z"
                  verified_at: "2026-08-17T10:05:00Z"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"
        "404":
          description: No KYC submission found
          content:
            application/json:
              example:
                status: "error"
                error: "kyc application not found"

  /api/v1/auth/kyc/review:
    post:
      summary: Review & Approve KYC (Upgrade User Tier 1 -> Tier 2)
      tags:
        - KYC
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [approved, rejected]
                  example: "approved"
                rejection_reason:
                  type: string
                  example: ""
      responses:
        "200":
          description: KYC reviewed and user upgraded to Tier 2 (if approved)
          content:
            application/json:
              example:
                status: "success"
                message: "KYC review processed successfully"
                data:
                  id: "kyc-uuid-123"
                  status: "approved"
                  verified_at: "2026-08-17T10:05:00Z"
        "400":
          description: Invalid review status or no pending submission
          content:
            application/json:
              example:
                status: "error"
                error: "only pending KYC applications can be reviewed"
        "401":
          description: Unauthorized
          content:
            application/json:
              example:
                status: "error"
                error: "unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
