spring.application.name=customer-service

# Port HTTP
server.port=8082

# Database PostgreSQL (customer_db di port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/customer_db
spring.datasource.username=bastion
spring.datasource.password=bastion_secret
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Kafka Consumer (Redpanda di port 19092)
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=customer-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# JWT Configuration (Shared secret dengan Identity Service)
jwt.secret=${JWT_SECRET:super_secret_bastion_key_change_in_production_12345}

